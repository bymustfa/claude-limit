name: Bug report
description: Something in ClaudeLimit does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the open issues first in case it is already known.
        Security problems go through [SECURITY.md](https://github.com/bymustfa/claude-limit/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw and what you expected instead. Screenshots of the panel help a lot.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: usage-output
    attributes:
      label: Output of `claude -p "/usage"`
      description: |
        For wrong or missing percentages, paste what this command prints in your terminal.
        Remove anything you do not want to share.
      render: text
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 26.1
    validations:
      required: true
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: ClaudeLimit commit
      description: Output of `git rev-parse --short HEAD` in your clone.
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Turkish
